<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/bootstrap.css">
</head>

<body>

    <div class="container">
        <div class="page-header">
            {# Exibindo o título da página que vem do render_template #}
            <h1>{{ titulo }}</h1>
        </div>


        <a class="btn btn-primary" href="{{ url_for('login') }}">Login</a>
        <a class="btn btn-danger" href="{{ url_for('logout')}}">Logout</a>
        <a class="btn btn-primary" href="{{url_for('novo')}}">Novo jogo</a>


        <table class="table table-striped table-responsive table-bordered">
            <thead class="thead-default">
                <tr>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Console</th>
                    <th></th>
                </tr>
            </thead>
            
            <tbody>
                {# Percorrendo a lista de jogos e exibindo na tabela #}
                {% for jogo in jogos %}
                <tr>
                    <td>{{ jogo.nome }}</td>
                    <td>{{ jogo.categoria }}</td>
                    <td>{{ jogo.console }}</td>
                    <td>
                        <a href="{{ url_for('editar', id=jogo.id) }}">Editar</a>
                        <a href="{{ url_for('deletar', id=jogo.id) }}">Deletar</a>
                    </td>
                </tr>
                {% endfor %}
              
            </tbody>
        </table>
    </div>

</body>
</html>
